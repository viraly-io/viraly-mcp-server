name: Deploy (staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

# These steps are placeholders. Production wiring happens during Phase 5
# CTO handoff — the AWS account, App Runner service ARN, and OIDC role
# are not yet provisioned. Once they are, set the secrets named below
# and remove the `if: false` guard.

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPO: viraly-mcp-server
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPO:staging .
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:staging

      - name: Trigger App Runner deploy
        env:
          SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN_STAGING }}
        run: aws apprunner start-deployment --service-arn $SERVICE_ARN
