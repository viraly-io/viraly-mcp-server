name: Deploy (staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Wired up to AWS via OIDC. The role this assumes is locked to:
#   - this exact repo (viraly-io/viraly-mcp-server)
#   - this exact branch ref (refs/heads/staging)
# and has scoped permissions: ECR push to viraly-mcp-server (us-east-2 only)
# and apprunner:StartDeployment on viraly-mcp-server-staging only. It cannot
# touch prod, cannot read secrets, cannot create new IAM resources.
#
# Repo secrets used:
#   AWS_DEPLOY_ROLE_ARN_STAGING        — the staging deploy role
#   APP_RUNNER_SERVICE_ARN_STAGING     — staging service ARN
#
# Actions pinned to commit SHAs (tag in trailing comment) so a compromised
# tag can't push malicious code into the deploy path.

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: us-east-2

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPO: viraly-mcp-server
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --provenance=false --sbom=false \
            -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPO:staging .
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:staging

      # No explicit StartDeployment call — the staging App Runner service has
      # AutoDeploymentsEnabled=true, so pushing :staging above triggers the
      # deploy automatically. Calling StartDeployment here would race with the
      # auto-deploy and fail with "service is not in RUNNING state."
      #
      # If you ever flip AutoDeploymentsEnabled to false on the staging service,
      # add this step back:
      #
      #   - name: Trigger App Runner deploy
      #     env:
      #       SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN_STAGING }}
      #     run: aws apprunner start-deployment --service-arn $SERVICE_ARN
      - name: Wait for App Runner auto-deploy to settle
        env:
          SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN_STAGING }}
        run: |
          for i in $(seq 1 20); do
            STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
            echo "  attempt $i: $STATUS"
            [ "$STATUS" = "RUNNING" ] && exit 0
            sleep 30
          done
          echo "::error::App Runner did not return to RUNNING within 10 minutes"
          exit 1
