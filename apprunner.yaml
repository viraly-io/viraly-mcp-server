# AWS App Runner service configuration for viraly-mcp-server.
#
# Deploys via Docker (apprunner reads the Dockerfile in repo root).
# Runtime configuration comes from environment variables — see README.md
# for the full list. Secrets (none required in v1) would go in Secrets
# Manager and be referenced via `RuntimeEnvironmentSecrets`.

version: 1.0
runtime: docker
build:
  commands:
    pre-build: []
    build:
      - echo "Building viraly-mcp-server image"
    post-build: []
run:
  runtime-version: latest
  command: node dist/server.js
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: MCP_TRANSPORT
      value: http
    - name: VIRALY_API_ORIGIN
      value: https://api.viraly.io
    - name: VIRALY_OAUTH_ISSUER
      value: https://api.viraly.io
    - name: MCP_PUBLIC_ORIGIN
      value: https://mcp.viraly.io
    - name: LOG_LEVEL
      value: info
    - name: MCP_RATE_LIMIT_PER_MINUTE
      value: "300"
    # CORS is empty in production — the MCP HTTP transport is consumed by
    # server-to-server clients (Claude.ai, ChatGPT). Browser-based MCP
    # clients are out of scope for v1.
    - name: MCP_CORS_ORIGINS
      value: ""
